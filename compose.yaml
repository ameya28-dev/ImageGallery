services:
  backend:
    build:
      context: ./ImageAPI
      dockerfile: Dockerfile
    # Port 8080 is internal only (not exposed to host)
    # Access via nginx reverse proxy on host port 8000
    environment:
      SPRING_PROFILES_ACTIVE: local
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - gallery-data:/app/data
    networks:
      - backend-tier

  nginx:
    image: nginx:alpine
    ports:
      - "8000:8000"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - frontend-tier
      - backend-tier

  frontend:
    build:
      context: ./ImageWebPage
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      # From browser: call nginx on host port 8000
      # (API paths already include /api/ prefix)
      NEXT_PUBLIC_API_URL: http://localhost:8000
      # From SSR: call nginx via backend-tier network (if SSR calls backend)
      BACKEND_URL: http://nginx:8000
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - ./ImageWebPage:/app
      - frontend-node-modules:/app/node_modules
      - frontend-next:/app/.next
    depends_on:
      - nginx
    networks:
      - frontend-tier

networks:
  frontend-tier:
  backend-tier:

volumes:
  gallery-data:
  frontend-node-modules:
  frontend-next:
