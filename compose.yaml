services:
  backend:
    build:
      context: ./ImageAPI
      dockerfile: Dockerfile
    # Port 8080 is internal only (not exposed to host)
    # Access via nginx reverse proxy on host port 8000
    environment:
      SPRING_PROFILES_ACTIVE: local
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - gallery-data:/app/data
    networks:
      - backend-tier
    healthcheck:
      test: ["CMD", "bash", "-c", "curl -s -o /dev/null http://localhost:8080 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 55s

  nginx:
    image: nginx:alpine
    ports:
      - "8000:8000"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - frontend-tier
      - backend-tier
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  frontend:
    build:
      context: ./ImageWebPage
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      # From browser: call nginx on host port 8000
      # (API paths already include /api/ prefix)
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      # From SSR: call nginx via backend-tier network (if SSR calls backend)
      BACKEND_URL: http://nginx:8000
      # Local profile: guest mode enabled, seed import available
      NEXT_PUBLIC_GUEST_MODE: "true"
      NEXT_PUBLIC_SEED_IMPORT_ENABLED: "true"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - ./ImageWebPage:/app
      - frontend-node-modules:/app/node_modules
      - frontend-next:/app/.next
    depends_on:
      nginx:
        condition: service_healthy
    networks:
      - frontend-tier
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 60s

  # Debug-only: browse the SQLite database via a web UI (coleifer/sqlite-web).
  # Opt-in via Compose profile — does NOT start with a plain `docker compose up`.
  # Start with:  docker compose --profile debug up -d sqlite-web
  # NOTE: only useful when the backend runs the `local` Spring profile (SQLite).
  # Under `feature` (PostgreSQL) this container has nothing to show — expected, not a bug.
  sqlite-web:
    image: coleifer/sqlite-web
    profiles: ["debug"]
    ports:
      - "8085:8080"
    volumes:
      - gallery-data:/data
    # The image's default shell entrypoint expects database path as first positional argument.
    # Pass it via shell -c to ensure the argument reaches the application correctly.
    # Bind to 0.0.0.0 (not 127.0.0.1) so the container's port 8080 is accessible to Docker's port mapper.
    command: sh -c "cd /data && python -m sqlite_web gallery.db -H 0.0.0.0"
    depends_on:
      backend:
        condition: service_healthy

networks:
  frontend-tier:
  backend-tier:

volumes:
  gallery-data:
  frontend-node-modules:
  frontend-next:
